services:
  db:
    image: postgres:16-alpine
    container_name: sneaker_drop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: drop
      POSTGRES_PASSWORD: drop
      POSTGRES_DB: drop
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - sneaker_drop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drop -d drop"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  sneaker_drop_pgdata:
